apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyleaf
  namespace: storyleaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storyleaf
  template:
    metadata:
      labels:
        app: storyleaf
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        storyleaf-local-image: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storyleaf
          image: localhost/storyleaf:k3s
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: storyleaf-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storyleaf
  namespace: storyleaf
spec:
  type: NodePort
  selector:
    app: storyleaf
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30088
